AWSTemplateFormatVersion: "2010-09-09"
Description: "Plantilla para crear MV de aplicacion (MV Pruebas 1 / MV Pruebas 2) con puerto 8000 abierto para los microservicios"

Parameters:
  InstanceName:
    Type: String
    Default: "MV Pruebas"
    Description: "Nombre de la instancia (MV Pruebas 1 o MV Pruebas 2)"
  AMI:
    Type: String
    Default: "ami-0b33d2f1547e52c78"
    Description: "ID de AMI (Cloud9Ubuntu22-2026-03-24)"

Resources:
  EC2Instance:
    Type: "AWS::EC2::Instance"
    Properties:
      Tags:
        - Key: "Name"
          Value: !Ref InstanceName
      ImageId: !Ref AMI
      InstanceType: "t3.micro"
      KeyName: "vockey"
      SecurityGroupIds:
        - !Ref InstanceSecurityGroup
      BlockDeviceMappings:
        - DeviceName: /dev/sda1
          Ebs:
            VolumeSize: "20"

  InstanceSecurityGroup:
    Type: "AWS::EC2::SecurityGroup"
    Properties:
      GroupDescription: "Puerto 8000 para microservicios, 8080 para swagger, 22 para SSH"
      SecurityGroupIngress:
        - IpProtocol: "tcp"
          FromPort: "22"
          ToPort: "22"
          CidrIp: "0.0.0.0/0"
        - IpProtocol: "tcp"
          FromPort: "8000"
          ToPort: "8000"
          CidrIp: "0.0.0.0/0"
        - IpProtocol: "tcp"
          FromPort: "8080"
          ToPort: "8080"
          CidrIp: "0.0.0.0/0"

Outputs:
  InstanceId:
    Description: "ID de la instancia EC2"
    Value: !Ref EC2Instance
  InstancePublicIP:
    Description: "IP publica"
    Value: !GetAtt EC2Instance.PublicIp
  InstancePrivateIP:
    Description: "IP privada"
    Value: !GetAtt EC2Instance.PrivateIp
